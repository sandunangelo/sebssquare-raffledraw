<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Raffle Drawer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#050705" />
    <meta
      name="description"
      content="Live raffle draw stage - reads candidates from a public Google Sheet and draws a winner over 30 seconds."
    />
    <!-- PNGs first and under their own names: browsers pin /favicon.ico very
         hard, so a previously cached one can survive a replacement. These are
         ordinary resources the browser has never seen before. -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="favicon-192.png" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="16x16 32x32 48x48" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
